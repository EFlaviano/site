# Cabeçalhos do site público. Incluído no server e em cada location que
# define add_header, porque o nginx não herda add_header de níveis acima
# quando o nível atual declara algum. "always" aplica também a 404 e 405.
add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; img-src 'self'; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; frame-src 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# O domínio já envia HSTS de 1 ano no site atual; manter o mesmo valor.
add_header Strict-Transport-Security "max-age=31536000" always;
