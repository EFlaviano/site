# nginx do container EasyPanel (TLS termina no painel, aqui só a porta 80).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # O canônico é o apex. www responde hoje com o mesmo site e duplica as URLs.
    if ($host = www.eduardocota.adv.br) {
        return 301 https://eduardocota.adv.br$request_uri;
    }
    index index.html;
    server_tokens off;
    autoindex off;
    absolute_redirect off;
    charset utf-8;
    client_max_body_size 1k;

    types {
        text/html html;
        text/css css;
        application/xml xml;
        text/plain txt;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
        image/avif avif;
        font/woff2 woff2;
        image/x-icon ico;
        text/javascript js;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/xml text/plain image/svg+xml text/javascript;

    include /etc/nginx/snippets/eduardo-seguranca.conf;

    error_page 404 /404.html;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/eduardo-seguranca.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~ /\. { return 404; }
    location ^~ /admin/ { return 404; }
    location ^~ /cms/ { return 404; }
    location ~* \.(map|md|ya?ml|json|mjs|ts|sh|bak|old|orig|swp|sql|tar|gz|zip|env|conf|log)$ { return 404; }

    location ~ "^/_astro/[A-Za-z0-9_][A-Za-z0-9._-]*\.[A-Za-z0-9_-]{8,12}\.js$" {
        try_files $uri =404;
        include /etc/nginx/snippets/eduardo-seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~* \.js$ { return 404; }

    location ~* "\.[A-Za-z0-9_-]{8,12}\.(css|woff2)$" {
        try_files $uri =404;
        include /etc/nginx/snippets/eduardo-seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~* "\.[0-9a-f]{12}\.(png|jpe?g|webp|avif)$" {
        try_files $uri =404;
        include /etc/nginx/snippets/eduardo-seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~* \.(svg|png|ico|woff2)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/eduardo-seguranca.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ~ /$ {
        include /etc/nginx/snippets/eduardo-seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files ${uri}index.html =404;
    }
    location / {
        include /etc/nginx/snippets/eduardo-seguranca.conf;
        add_header Cache-Control "no-cache" always;
        if (-d $request_filename) {
            rewrite ^(.*[^/])$ $1/ permanent;
        }
        try_files $uri =404;
    }
}
