server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/xml image/svg+xml;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Assets sem versão no nome: 7 dias. Usar expires, não add_header —
    # add_header aqui apagaria os cabeçalhos de segurança herdados acima.
    location ~* \.(woff2|svg|png|ico)$ {
        expires 7d;
    }
}
