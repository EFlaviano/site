    --tinta-suave:var(--cedro);

  .link{

    align-items:center;
    gap:15px;
    width:100%;
    padding:20px 22px;
    border:0;
    border-radius:var(--raio-botao);

    color:var(--sobre-acento);
    font-family:var(--fonte);
    text-align:left;
    text-decoration:none;
    cursor:pointer;
    transition:background .18s ease;
  }

  .link:hover,
  .link:focus-visible{background:var(--acento-hover);}

  .link:focus-visible{
    outline:2px solid var(--tinta);
    outline-offset:3px;
  }

  /* Secundários: cartão branco, borda em neutro linha, sem sombra (MARCA 07) */
  .link.secundario{
    background:var(--superficie);
    color:var(--tinta);

  .link .texto{

  /* Marca gráfica: sangra pela borda direita, atrás do texto */
  .grafismo{
    position:absolute;
    right:-14px;
    top:50%;
    transform:translateY(-50%);
    width:104px;
    height:104px;
    pointer-events:none;

  /* Só deslize, sem fade: conteúdo em opacity:0 impede o FCP e o Lighthouse não mede. */

  }

  @media (prefers-reduced-motion: reduce){

    .link:hover{transform:none;}
